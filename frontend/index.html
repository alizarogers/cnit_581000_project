<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PunBot</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div>
        <h1 class="header-title">PunBot</h1>
        <p class="header-subtitle">CNIT 58100 group project · two senses, one joke</p>
      </div>
      <button id="newChatBtn" class="ghost-btn" type="button">New chat</button>
    </div>
  </header>

  <main class="chat-container" id="chat">
    <div class="messages" id="messages">
      <div class="message message--assistant">
        <div class="message__bubble">
          <p>Hi! Paste a pun and I'll find the word doing double duty, define both senses, and check whether the joke holds together. Then ask me anything about it.</p>
          <p class="examples-label">Try one:</p>
          <div class="examples" id="examples">
            <button type="button" class="chip">I used to be a banker, but I lost interest.</button>
            <button type="button" class="chip">A boiled egg in the morning is hard to beat.</button>
            <button type="button" class="chip">Time flies like an arrow; fruit flies like a banana.</button>
            <button type="button" class="chip">What makes a pun fail?</button>
          </div>
        </div>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </main>

  <footer class="input-area">
    <div class="input-row">
      <textarea id="userInput" class="input-box" placeholder="Enter a pun or ask a question..." rows="1" aria-label="Your message"></textarea>
      <button id="sendBtn" class="send-btn" aria-label="Send message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <p class="disclaimer" id="modelLabel">Answers generated by Claude</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
